---
name: Lint

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Superseded PR runs are cancelled; every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Markdown-only PRs skip the checks they cannot affect.
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the PR's file list through the API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        # Only a pull_request has two refs to compare; other events run
        # every check (see the gated jobs' conditions).
        if: github.event_name == 'pull_request'
        with:
          # Under the default `some` quantifier a negated pattern matches every
          # path it does not name, so `code` is true for any change but Markdown.
          filters: |
            code:
              - '!**/*.md'
              # pyproject.toml names README.md as the package readme, so uv sync
              # builds the project from it.
              - 'README.md'

  lint:
    # Fail closed: a job skipped after a failed `needs` reports `skipped`,
    # which satisfies a required check.
    needs: detect-changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.detect-changes.result != 'success'
      || needs.detect-changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.20"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src/
