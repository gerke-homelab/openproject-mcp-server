---
name: PR Title

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main"]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# No concurrency group: one Renovate push fires `synchronize` and `edited` a
# second apart, and cancel-in-progress leaves the first run cancelled on the
# head commit, which the dependency-review gate reads as a failed check.
# Both runs are cheap and both pass.

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f  # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          scopes: |
            server
            api
            tools
            ci
            deps
            config
            docs
            tests
            release
            auth
