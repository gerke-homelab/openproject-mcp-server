---
name: secrets

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    # GitHub-hosted only: this repo is public, so a fork PR runs untrusted code.
    runs-on: ubuntu-latest
    steps:
      # The PR head, not the synthetic merge commit: that one's first parent is
      # main, so a range counted back from it takes in the latest main commits.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # One commit past the PR's first, so the oldest PR commit has a parent to
      # diff against. GitHub expressions have no arithmetic, so the `+ 1` has to
      # happen in the shell.
      - name: Deepen to cover this PR's commits
        run: |
          git fetch --depth=$(( ${{ github.event.pull_request.commits }} + 1 )) \
            origin "${{ github.event.pull_request.head.sha }}"

      # The checksum is a literal and the download goes to a file, because
      # `curl | tar` verifies nothing.
      #
      # KEEP THE VERSION AND CHECKSUM IN SYNC with
      # actions_runner_gitleaks_{version,checksum} in the infrastructure repo's
      # actions_runner role, which lists every copy.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks

      # History is linear on every branch, so the head's last N commits are
      # exactly the PR's N, however far main has moved.
      - name: Run gitleaks
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --verbose --redact \
            --log-opts="--max-count=${{ github.event.pull_request.commits }} HEAD"
