---
name: secrets

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    # GitHub-hosted only: this repo is public, so a fork PR runs untrusted code.
    runs-on: ubuntu-latest
    steps:
      # Full history: the base..head range below needs the merge base present.
      # At a shallow boundary git diffs the boundary commit against nothing, so
      # the scan would cover that commit's whole tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The checksum is a literal and the download goes to a file, because
      # `curl | tar` verifies nothing.
      #
      # KEEP THE VERSION AND CHECKSUM IN SYNC with
      # actions_runner_gitleaks_{version,checksum} in the infrastructure repo's
      # actions_runner role, which lists every copy.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks

      # The config comes from the base commit, never from the PR: a PR could
      # otherwise allowlist or disable the rules that gate it. With no config
      # at base, an explicit default-rules file stops gitleaks from loading a
      # .gitleaks.toml the PR adds.
      - name: Take the gitleaks config from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
            git show "${BASE_SHA}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "${RUNNER_TEMP}/gitleaks.toml"
          fi

      # Exactly the PR's commits, merge commits included. gitleaks runs
      # `git log -p`, which prints no diff for a merge unless asked, so content
      # introduced while resolving a merge would otherwise go unscanned.
      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --config "${RUNNER_TEMP}/gitleaks.toml" \
            --source . \
            --verbose --redact \
            --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}"
